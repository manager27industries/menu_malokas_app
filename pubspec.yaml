name: menu_malokas
description: "App de menú digital para Raíces — restaurante premium."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^14.6.3

  # Tipografías
  google_fonts: ^6.2.1

  # Abrir PDF del menú
  url_launcher: ^6.3.1

  # Persistir idioma seleccionado
  shared_preferences: ^2.3.3

  # Visor de modelos 3D (.GLB) en Android y Web
  model_viewer_plus: ^1.10.0

  # Renderizado de SVG
  flutter_svg: ^2.0.10+1

  # Supabase — Auth + Storage
  supabase_flutter: ^2.8.4

  # Selector de archivo PDF para el admin
  file_picker: ^11.0.0

  # Visor web embebido (para PDF en móvil nativo)
  webview_flutter: ^4.10.0

  # Visor de PDF nativo (sin WebView) — Android, iOS, Web
  pdfx: ^2.9.0

  # HTTP para descargar PDF en web (pdfx web solo acepta bytes)
  http: ^1.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Generación de código l10n
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/img/
    - assets/images/svg/
    - assets/data/
    - assets/pdf/
