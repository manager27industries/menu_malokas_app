<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Raíces Restaurante — Menú digital.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Raíces">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Raíces — Menú Digital</title>
  <link rel="manifest" href="manifest.json">
  <!-- model-viewer web component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <!-- pdf.js (UMD, sincrónico) requerido por pdfx — debe cargar ANTES de Flutter -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    var pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
      cMapPacked: true,
    }
  </script>

  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #efe3d1;
      opacity: 1;
      visibility: visible;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    #app-splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-center {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 24px;
    }

    .splash-logo-wrap {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(73, 49, 28, 0.18);
      animation: logo-pulse 1.6s ease-in-out infinite;
    }

    .splash-logo {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes logo-pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Cargando aplicación">
    <div class="splash-center">
      <div class="splash-logo-wrap" aria-hidden="true">
        <img class="splash-logo" src="icons/Icon-192.png" alt="Raíces" />
      </div>
    </div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;

      var hideSplash = function () {
        splash.classList.add('splash-hidden');
        window.setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 320);
      };

      // Evento oficial que Flutter Web emite cuando pinta el primer frame.
      window.addEventListener('flutter-first-frame', hideSplash, { once: true });

      // Fallback de seguridad por si el evento tarda demasiado.
      window.setTimeout(hideSplash, 8000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
